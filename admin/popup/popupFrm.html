<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT 관리자</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/overlayscrollbars.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/tabulator.min.css">
    <link rel="stylesheet" href="../assets/css/adminlte.css">
    <link rel="stylesheet" href="../assets/css/flatpickr.min.css">
    <link rel="stylesheet" href="../assets/css/customize.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item user-menu d-flex align-items-center me-3">
                        홍길동
                    </li>
                    <li>
                        <a href="#none" class="btn btn-secondary btn-sm float-end">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="btn-logout fw-bolder">로그아웃</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- //header -->

        <!-- menu -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <!-- logo -->
            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">
                </a>
            </div>
            <!-- //logo -->

            <!-- menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2" aria-label="Main navigation">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false"
                        id="navigation">
                        <li class="nav-item">
                            <a href="../page_list.html" class="nav-link active">
                                <p>page_list</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //menu -->
        </aside>
        <!-- //menu -->

        <!-- main -->
        <main class="app-main">
            <!-- title -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">팝업 관리</h3>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //title -->

            <!-- content -->
            <div class="app-content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <form action="">
                                <div class="row mb-3">
                                    <label for="title" class="col-sm-2 col-form-label text-center fw-bold">제목</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="title" id="title">
                                    </div>
                                </div>
                            
                                <div class="row mb-3">
                                    <label for="popup_width" class="col-sm-2 col-form-label text-center fw-bold">이미지 사이즈(가로)</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control d-inline" name="popup_width" id="popup_width" style="width: 20%"> <span class="text-primary">px</span>
                                        <span class="ms-4 text-primary">* 숫자로만 입력</span>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="popup_height" class="col-sm-2 col-form-label text-center fw-bold">이미지 사이즈(세로)</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control d-inline" name="popup_height" id="popup_height" style="width: 20%"> <span class="text-primary">px</span>
                                        <span class="ms-4 text-primary">* 숫자로만 입력</span>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="popup_left" class="col-sm-2 col-form-label text-center fw-bold">왼쪽 여백</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control d-inline" name="popup_left" id="popup_left" style="width: 20%"> <span class="text-primary">px</span>
                                        <span class="ms-4 text-primary">* 숫자로만 입력(미입력시 센터 위치)</span>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="popup_top" class="col-sm-2 col-form-label text-center fw-bold">상단 여백</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control d-inline" name="popup_top" id="popup_top" style="width: 20%"> <span class="text-primary">px</span>
                                        <span class="ms-4 text-primary">* 숫자로만 입력(미입력시 센터 위치)</span>
                                    </div>
                                </div>
                            
                                <div class="row mb-3">
                                    <span class="col-sm-2 col-form-label text-center fw-bold">활성 여부</span>
                                    <div class="col-sm-10 d-flex align-items-center">
                                        <div class="form-check me-5">
                                            <input class="form-check-input" type="radio" name="display" id="display_y" checked>
                                            <label class="form-check-label" for="display_y">활성</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="display" id="display_n">
                                            <label class="form-check-label" for="display_n">비활성</label>
                                        </div>
                                    </div>
                                </div>
                            
                                <div class="row mb-3">
                                    <label for="period" class="col-sm-2 col-form-label text-center fw-bold">노출 기간</label>
                                    <div class="col-sm-10 d-flex align-itmes-center">
                                        <div class="flatpickr-wrapper form-control d-inline p-0" style="width: 200px;">
                                            <input type="text" data-input id="period1" />
                                            <button type="button" class="calendar-btn" data-toggle>
                                                <i class="bi bi-calendar"></i>
                                            </button>
                                        </div>
                                        <div class="d-flex align-items-center p-2">~</div>
                                        <div class="flatpickr-wrapper form-control d-inline p-0" style="width: 200px;">
                                            <input type="text" data-input id="period2" />
                                            <button type="button" class="calendar-btn" data-toggle>
                                                <i class="bi bi-calendar"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            
                                <div class="row mb-3">
                                    <label for="uploadFile" class="col-sm-2 col-form-label text-center fw-bold">팝업 배너</label>
                                    <div class="col-sm-10">
                                        <input class="form-control" type="file" id="uploadFile">
                                        <img src="https://www.woongjin.com/File_win/images/popup/20260312/176902e6465f4eaabf738ad3af0d9ab2.jpg" alt="" class="mt-3"> <!-- 상세 이미지 -->
                                    </div>
                                </div>
                            
                                <div class="row mb-3">
                                    <span class="col-sm-2 col-form-label text-center fw-bold">링크 타입</span>
                                    <div class="col-sm-10 d-flex align-items-center">
                                        <div class="form-check me-3">
                                            <input class="form-check-input" type="radio" name="link_type" id="target" checked>
                                            <label class="form-check-label" for="target">새창</label>
                                        </div>
                                        <div class="form-check me-3">
                                            <input class="form-check-input" type="radio" name="link_type" id="self">
                                            <label class="form-check-label" for="self">현재창</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="link_type" id="linkNo">
                                            <label class="form-check-label" for="linkNo">링크없음</label>
                                        </div>
                                    </div>
                                </div>
                            
                                <div class="row mb-3">
                                    <label for="link_url" class="col-sm-2 col-form-label text-center fw-bold">배너 링크</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="link_url" placeholder="ex) http://www.xxxxxx.xxx">
                                    </div>
                                </div>
                            
                                <div class="row d-flex align-items-center">
                                    <label for="meno" class="col-sm-2 col-form-label text-center fw-bold">메모</label>
                                    <div class="col-sm-10">
                                        <textarea class="form-control" id="meno" rows="3"></textarea>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer text-end">
                            <button type="button" class="btn btn-danger">취소</button>
                            <button type="button" class="btn btn-primary">저장</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //content -->
        </main>
        <!-- //main -->
    </div>

    <!-- Scripts -->
    <script src="../assets/js/overlayscrollbars.browser.es6.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <script src="../assets/js/flatpickr.min.js"></script>
    <script src="../assets/js/flatpickr_ko.js"></script>
    <!-- //Scripts -->

    <script>
        flatpickr(".flatpickr-wrapper", {
            wrap: true,
            locale: "ko",
            enableTime: true,
            time_24hr: true,
            minuteIncrement: 10
        });
    </script>
</body>

</html>
