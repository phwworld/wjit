<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../assets/css/customize.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">

                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item user-menu d-flex align-items-center me-3">
                        홍길동
                    </li>
                    <li>
                        <a href="#none" class="btn btn-secondary btn-sm float-end">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="btn-logout fw-bolder">로그아웃</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- //header -->

        <!-- menu -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <!-- logo -->
            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">
                </a>
            </div>
            <!-- //logo -->

            <!-- menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2" aria-label="Main navigation">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false"
                        id="navigation">
                        <li class="nav-item">
                            <a href="../page_list.html" class="nav-link active">
                                <p>page_list</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //menu -->
        </aside>
        <!-- //menu -->

        <!-- main -->
        <main class="app-main">
            <!-- title -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">고객 성공사례 관리</h3>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //title -->

            <!-- content -->
            <div class="app-content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <div class="row text-end mb-2">
                                <div class="col">
                                    <span class="d-inline text-danger ms-2">*</span> 표시는 필수 입력 항목입니다.
                                </div>
                            </div>
                            <form action="">
                                <div class="row mb-3">
                                    <span class="col-sm-2 col-form-label text-center fw-bold">활성 여부</span>
                                    <div class="col-sm-10 d-flex align-items-center">
                                        <div class="form-check me-5">
                                            <input class="form-check-input" type="radio" name="display" id="display_y" checked>
                                            <label class="form-check-label" for="display_y">활성</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="display" id="display_n">
                                            <label class="form-check-label" for="display_n">비활성</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="category" class="col-sm-2 col-form-label text-center fw-bold">카테고리<span class="text-danger ms-2">*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="category" id="category">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="case_main1" class="col-sm-2 col-form-label text-center fw-bold">메인텍스트1<span class="text-danger ms-2">*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_main1" id="case_main1">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="case_sub1" class="col-sm-2 col-form-label text-center fw-bold">서브텍스트1<span class="text-danger ms-2">*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_sub1" id="case_sub1">
                                    </div>
                                </div>
                                
                                <div class="row mb-3">
                                    <label for="case_link1" class="col-sm-2 col-form-label text-center fw-bold">링크1</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_link1" id="case_link1">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="case_main2" class="col-sm-2 col-form-label text-center fw-bold">메인텍스트2<span class="text-danger ms-2">*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_main2" id="case_main2">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="case_sub2" class="col-sm-2 col-form-label text-center fw-bold">서브텍스트2<span class="text-danger ms-2">*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_sub2" id="case_sub2">
                                    </div>
                                </div>
                                
                                <div class="row mb-3">
                                    <label for="case_link2" class="col-sm-2 col-form-label text-center fw-bold">링크2</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_link2" id="case_link2">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="case_main3" class="col-sm-2 col-form-label text-center fw-bold">메인텍스트3</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_main3" id="case_main3">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="case_sub3" class="col-sm-2 col-form-label text-center fw-bold">서브텍스트3</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_sub3" id="case_sub3">
                                    </div>
                                </div>
                                
                                <div class="row mb-3">
                                    <label for="case_link3" class="col-sm-2 col-form-label text-center fw-bold">링크3</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="case_link3" id="case_link3">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="uploadFile" class="col-sm-2 col-form-label text-center fw-bold">이미지<span class="text-danger ms-2">*</span></label>
                                    <div class="col-sm-10">
                                        <input class="form-control" type="file" id="uploadFile">
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer text-end">
                            <button type="button" class="btn btn-danger">취소</button>
                            <button type="button" class="btn btn-primary">저장</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //content -->
        </main>
        <!-- //main -->
    </div>

    <!-- Scripts -->
    <script src="../assets/js/overlayscrollbars.browser.es6.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <script src="../assets/js/flatpickr.min.js"></script>
    <script src="../assets/js/flatpickr_ko.js"></script>
