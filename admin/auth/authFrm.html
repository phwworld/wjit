<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT 관리자</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/overlayscrollbars.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/tabulator.min.css">
    <link rel="stylesheet" href="../assets/css/adminlte.css">
    <link rel="stylesheet" href="../assets/css/flatpickr.min.css">
    <link rel="stylesheet" href="../assets/css/customize.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item user-menu d-flex align-items-center me-3">
                        홍길동
                    </li>
                    <li>
                        <a href="#none" class="btn btn-secondary btn-sm float-end">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="btn-logout fw-bolder">로그아웃</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- //header -->

        <!-- menu -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <!-- logo -->
            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">
                </a>
            </div>
            <!-- //logo -->

            <!-- menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2" aria-label="Main navigation">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false"
                        id="navigation">
                        <li class="nav-item">
                            <a href="../page_list.html" class="nav-link active">
                                <p>page_list</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //menu -->
        </aside>
        <!-- //menu -->

        <!-- main -->
        <main class="app-main">
            <!-- title -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">권한 관리</h3>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //title -->

            <!-- content -->
            <div class="app-content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <form action="">
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <div class="row">
                                            <label for="com" class="col-sm-3 col-form-label text-center fw-bold">회사코드</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="com" id="com">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-6">
                                        <div class="row">
                                            <label for="empNo" class="col-sm-3 col-form-label text-center fw-bold">사번</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="empNo" id="empNo">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <div class="row">
                                            <label for="userName" class="col-sm-3 col-form-label text-center fw-bold">이름</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="userName" id="userName">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-6">
                                        <div class="row">
                                            <label for="auth" class="col-sm-3 col-form-label text-center fw-bold">관리자권한</label>
                                            <div class="col-sm-9">
                                                <select class="form-select" aria-label="Default select example" name="auth" id="auth">
                                                    <option selected>선택하세요</option>
                                                    <option value="">슈퍼 관리자</option>
                                                    <option value="">웅진-강의실예약관리 관리자</option>
                                                    <option value="">문의하기 관리자</option>
                                                    <option value="">문의하기 관리자(콜센터)</option>
                                                    <option value="">솔루션 관리자</option>
                                                    <option value="">일반 관리자</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <div class="row">
                                            <label for="userId" class="col-sm-3 col-form-label text-center fw-bold">ID</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="userId" id="userId">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-6">
                                        <div class="row">
                                            <label for="userPwd" class="col-sm-3 col-form-label text-center fw-bold">PW</label>
                                            <div class="col-sm-9">
                                                <input type="password" class="form-control" name="userPwd" id="userPwd">
                                                <span class="d-block mt-1 text-primary">* 숫자,영문자,특수문자 중 2가지이상 조합으로 8자리 이상</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="email" class="col-sm-1 col-form-label text-center fw-bold" style="width: 12.5%;">이메일</label>
                                    <div class="col-sm-11" style="width: calc(100% - 12.5%);">
                                        <input type="text" class="form-control" name="email" id="email">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <div class="row align-items-center">
                                            <label for="phoneNo" class="col-sm-3 col-form-label text-center fw-bold">전화번호<br>(강의실담당자필수)</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="phoneNo" id="phoneNo">
                                            </div>
                                        </div>                                        
                                    </div>

                                    <div class="col-6">
                                        <div class="row align-items-center">
                                            <label for="hpNo" class="col-sm-3 col-form-label text-center fw-bold">핸드폰번호<br>(강의실담당자필수)</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="hpNo" id="hpNo">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <div class="row align-items-center">
                                            <label for="company" class="col-sm-3 col-form-label text-center fw-bold">회사이름<br>(강의실담당자필수)</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="company" id="company">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-6">
                                        <div class="row align-items-center">
                                            <label for="userName2" class="col-sm-3 col-form-label text-center fw-bold">강의실담당자명<br>(강의실담당자필수)</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" name="userName2" id="userName2">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-12 row">
                                        <label for="active" class="col-sm-1 col-form-label text-center fw-bold" style="width: 12.3%;">관리자사용여부</label>
                                        <div class="col-sm-11" style="width: 87.7%;">
                                            <select class="form-select" aria-label="Default select example" name="active" id="active" style="width: 20%;">
                                                <option selected>선택하세요</option>
                                                <option value="">사용</option>
                                                <option value="">미사용</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer text-end">
                            <button type="button" class="btn btn-danger">취소</button>
                            <button type="button" class="btn btn-primary">저장</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //content -->
        </main>
        <!-- //main -->
    </div>

    <!-- Scripts -->
    <script src="../assets/js/overlayscrollbars.browser.es6.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <script src="../assets/js/flatpickr.min.js"></script>
    <script src="../assets/js/flatpickr_ko.js"></script>
    <!-- //Scripts -->

    <script>
        flatpickr("#period1", {
            locale: "ko",
            enableTime: true,
            // mode: "range",
            time_24hr: true,
            minuteIncrement: 10
        });

        flatpickr("#period2", {
            locale: "ko",
            enableTime: true,
            // mode: "range",
            time_24hr: true,
            minuteIncrement: 10
        });
    </script>
</body>

</html>
