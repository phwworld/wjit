<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

        <!-- menu -->

            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">

            <!-- menu -->
            <div class="sidebar-wrapper">

        <!-- main -->

                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">프로젝트 사례<span class="page-title-info">(국문 상세)</span></h3>

            <!-- content -->
            <div class="app-content">

                    <div class="card">
                        <div class="card-body">
                            <div class="row justify-content-between mb-2">
                                <div class="col-4">
                                    <div class="page-count"></div>

                                <div class="col-6 text-end">
                                    <div class="row g-1">
                                        <div class="d-flex">
                                            <select class="form-select form-select-sm me-2" name="category1" id="category1" style="width: 50%;">
                                                <option selected>구분</option>
                                                <option>물류관리 시스템(SAP EWM)</option>
                                            </select>

    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <!-- //Scripts -->

    <!-- grid -->
    <script>
        let tabledata = [
            { no: "1", category1: "MANAGED SERVICE", category2: "AWS(Amazon Web Services)", logo: "https://www.woongjin.com/File_win/images/biz/20250516/8dd008bfab964be89a869b8e22214192.jpg", company: "라이프케어 P사 라이프케어 P사", projectName: "Power Platform을 활용한 수준측정 시스템 및 HSE 데이터 시각화", display: true, date: "2026-05-14", },
            { no: "2", category1: "MANAGED SERVICE", category2: "AWS(Amazon Web Services)", logo: "https://www.woongjin.com/File_win/images/biz/20250516/8dd008bfab964be89a869b8e22214192.jpg", company: "라이프케어 P사 라이프케어 P사", projectName: "Power Platform을 활용한 수준측정 시스템 및 HSE 데이터 시각화", display: false, date: "2026-07-14", },
            { no: "3", category1: "MANAGED SERVICE", category2: "AWS(Amazon Web Services)", logo: "https://www.woongjin.com/File_win/images/biz/20250516/8dd008bfab964be89a869b8e22214192.jpg", company: "라이프케어 P사 라이프케어 P사", projectName: "Power Platform을 활용한 수준측정 시스템 및 HSE 데이터 시각화", display: true, date: "2026-09-14", },
            { no: "4", category1: "MANAGED SERVICE", category2: "AWS(Amazon Web Services)", logo: "https://www.woongjin.com/File_win/images/biz/20250516/8dd008bfab964be89a869b8e22214192.jpg", company: "라이프케어 P사 라이프케어 P사", projectName: "Power Platform을 활용한 수준측정 시스템 및 HSE 데이터 시각화", display: false, date: "2026-11-14", },
            { no: "5", category1: "MANAGED SERVICE", category2: "AWS(Amazon Web Services)", logo: "https://www.woongjin.com/File_win/images/biz/20250516/8dd008bfab964be89a869b8e22214192.jpg", company: "라이프케어 P사 라이프케어 P사", projectName: "Power Platform을 활용한 수준측정 시스템 및 HSE 데이터 시각화", display: true, date: "2026-12-14", },
        ];

        let table = new Tabulator("#example-table", {
            data: tabledata,
            layout: "fitColumns",       // columns expand to fill the available width
            pagination: true,
            paginationSize: 10,
            paginationCounterElement:".page-count",
            paginationCounter: function (pageSize, currentRow, currentPage, totalRows, totalPages) {
                return `<span>현재 페이지 : ${currentPage} / ${totalPages}</span><span>전체글 : ${totalRows}개</span>`;
            },
            rowHeader: {
                headerSort: false, resizable: false, frozen: true, width: 50, headerHozAlign: "center", hozAlign: "center", cssClass: "align-center", formatter: "rowSelection", titleFormatter: "rowSelection", cellClick: function (e, cell) {
                    cell.getRow().toggleSelect();
                }
            },
            columns: [
                { title: "번호", field: "no", width: 80, headerHozAlign: "center", headerSort: false, },
                { title: "메뉴1", field: "category1", width: 160, headerHozAlign: "center", headerSort: false, },
                { title: "메뉴2", field: "category2", width: 220, headerHozAlign: "center", headerSort: false, },
                { title: "로고", field: "logo", width: 140, headerHozAlign: "center", headerSort: false, formatter: "textarea", formatter: function (cell, formatterParams) { let imgUrl = cell.getValue(); return "<img src='" + imgUrl + "' alt='배너이미지' style='width:130px;height:50px;'>";} },
                { title: "회사명", field: "company", width: 200, headerHozAlign: "center", headerSort: false, formatter: "textarea", },
                { title: "프로젝트명", field: "projectName", headerHozAlign: "center", headerSort: false, cssClass: "justify-content-start", formatter: "link", formatterParams: {url:"./referenceFrm.html"} },
                { title: "활성여부", field: "display", width: 120, headerHozAlign: "center", headerSort: true, formatter: function(cell) { return cell.getValue() === true ? "활성" : "비활성"; } },
                { title: "작성일", field: "date", width: 150, headerHozAlign: "center", headerSort: true, },
            ],
        });
    </script>
