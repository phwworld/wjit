    <script>
        let tabledata = [

        ];

        let table = new Tabulator("#example-table", {
            data: tabledata,
            layout: "fitColumns",       // columns expand to fill the available width
            pagination: true,
            paginationSize: 10,
            paginationCounterElement:".page-count",
            paginationCounter: function (pageSize, currentRow, currentPage, totalRows, totalPages) {
                return `<span>현재 페이지 : ${currentPage} / ${totalPages}</span><span>전체글 : ${totalRows}개</span>`;
            },
            columns: [
                { title: "번호", field: "no", width: 80, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "사이트", field: "site", width: 80, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "문의구분", field: "contactType", width: 100, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "문의제목", field: "title", headerHozAlign: "center", headerSort: false, formatter: "link", formatterParams: {url:"./contactDtl.html"} },
                { title: "이름", field: "name", width: 100, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "등록일", field: "registDate", width: 120, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
