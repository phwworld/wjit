<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT 관리자</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/overlayscrollbars.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <!-- <link rel="stylesheet" href="../assets/css/tabulator.min.css"> -->
    <link rel="stylesheet" href="../assets/css/tabulator_bootstrap5.css">
    <link rel="stylesheet" href="../assets/css/adminlte.css">
    <link rel="stylesheet" href="../assets/css/customize.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item user-menu d-flex align-items-center me-3">
                        홍길동
                    </li>
                    <li>
                        <a href="#none" class="btn btn-secondary btn-sm float-end">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="btn-logout fw-bolder">로그아웃</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- //header -->

        <!-- menu -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <!-- logo -->
            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">
                </a>
            </div>
            <!-- //logo -->

            <!-- menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2" aria-label="Main navigation">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false"
                        id="navigation">
                        <li class="nav-item">
                            <a href="../page_list.html" class="nav-link active">
                                <p>page_list</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //menu -->
        </aside>
        <!-- //menu -->

        <!-- main -->
        <main class="app-main">
            <!-- title -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">문의하기<span class="page-title-info">(eDM)</span></h3>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //title -->

            <!-- content -->
            <div class="app-content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <div class="row justify-content-between mb-2">
                                <div class="col-8">
                                    <div class="page-count"></div>
                                </div>
                                <div class="col-4 text-end">
                                    <div class="row g-1">
                                        <div class="d-flex">
                                            <select class="form-select form-select-sm me-2" style="width: 40%;">
                                                <option selected>선택</option>
                                                <option>eDM명</option>
                                            </select>

                                            <input type="text" class="form-control form-control-sm me-2">

                                            <button type="button" class="btn btn-dark btn-sm text-nowrap">검색</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div id="example-table"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //content -->
        </main>
        <!-- //main -->
    </div>

    <!-- Scripts -->
    <script src="../assets/js/overlayscrollbars.browser.es6.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <!-- //Scripts -->

    <!-- grid -->
    <script>
        let tabledata = [
            { no: "1", com: "77", empNo: "77104244", userName: "홍길동", userId: "77104244", auth: "슈퍼 관리자", date: "2026-05-14", display: true },
        ];

        let table = new Tabulator("#example-table", {
            data: tabledata,
            layout: "fitColumns",       // columns expand to fill the available width
            pagination: true,
            paginationSize: 10,
            paginationCounterElement:".page-count",
            paginationCounter: function (pageSize, currentRow, currentPage, totalRows, totalPages) {
                return `<span>현재 페이지 : ${currentPage} / ${totalPages}</span><span>전체글 : ${totalRows}개</span>`;
            },
            columns: [
                { title: "번호", field: "no", width: 80, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "회사코드", field: "com", headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "사번", field: "empNo", headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "이름", field: "userName", headerHozAlign: "center", headerSort: false, hozAlign: "center", formatter: "link", formatterParams: {url:"./authFrm.html"} },
                { title: "ID", field: "userId", headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "관리자권한", field: "auth", headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "생성일자", field: "date", headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "사용유무", field: "display", headerHozAlign: "center", headerSort: false, hozAlign: "center", formatter: function(cell) { return cell.getValue() === true ? "사용" : "미사용"; } },
            ],
        });
    </script>
</body>

</html>
