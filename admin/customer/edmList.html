    <script>
        let tabledata = [
            { no: "1", edmName: "2025_edu_PowerPlatform1", name: "홍**", companyName: "써밋에너지얼라이언스 유한회사", companyPosition: "부장", department: "영업팀", used: "사용처1", contactType: "방문 상담", agree: "Y", date: "2024-06-01" },

            { no: "3", edmName: "2025_edu_PowerPlatform3", name: "이**", companyName: "웅진", companyPosition: "대리", department: "기획팀", used: "사용처3", contactType: "방문 상담", agree: "Y", date: "2024-06-03" },

        let table = new Tabulator("#example-table", {
            data: tabledata,
            layout: "fitColumns",       // columns expand to fill the available width
            pagination: true,
            paginationSize: 10,
            paginationCounterElement:".page-count",
            paginationCounter: function (pageSize, currentRow, currentPage, totalRows, totalPages) {
                return `<span>현재 페이지 : ${currentPage} / ${totalPages}</span><span>전체글 : ${totalRows}개</span>`;
            },
            columns: [
                { title: "번호", field: "no", width: 80, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "eDM명", field: "edmName", headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "이름", field: "name", width: 80, headerHozAlign: "center", headerSort: false, hozAlign: "center", formatter: "link", formatterParams: {url:"./edmDtl.html"} },

            ],
