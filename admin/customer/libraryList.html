<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT 관리자</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/overlayscrollbars.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <!-- <link rel="stylesheet" href="../assets/css/tabulator.min.css"> -->
    <link rel="stylesheet" href="../assets/css/tabulator_bootstrap5.css">
    <link rel="stylesheet" href="../assets/css/adminlte.css">
    <link rel="stylesheet" href="../assets/css/customize.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item user-menu d-flex align-items-center me-3">
                        홍길동
                    </li>
                    <li>
                        <a href="#none" class="btn btn-secondary btn-sm float-end">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="btn-logout fw-bolder">로그아웃</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- //header -->

        <!-- menu -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <!-- logo -->
            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">
                </a>
            </div>
            <!-- //logo -->

            <!-- menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2" aria-label="Main navigation">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false"
                        id="navigation">
                        <li class="nav-item">
                            <a href="../page_list.html" class="nav-link active">
                                <p>page_list</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //menu -->
        </aside>
        <!-- //menu -->

        <!-- main -->
        <main class="app-main">
            <!-- title -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">미디어룸<span class="page-title-info">(국문)</span></h3>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //title -->

            <!-- content -->
            <div class="app-content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <div class="row justify-content-between mb-2">
                                <div class="col-8">
                                    <div class="page-count"></div>
                                </div>
                                <div class="col-4 text-end">
                                    <div class="row g-1">
                                        <div class="d-flex">
                                            <select class="form-select form-select-sm me-2" style="width: 40%;">
                                                <option selected>구분</option>
                                                <option value="event">이벤트</option>
                                                <option value="notice">공지사항</option>
                                            </select>

                                            <input type="text" class="form-control form-control-sm me-2">

                                            <button type="button" class="btn btn-dark btn-sm text-nowrap">검색</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div id="example-table" class="img-board"></div>
                        </div>

                        <div class="card-footer text-end">
                            <button type="button" class="btn btn-danger">삭제</button>
                            <button type="button" class="btn btn-primary">등록</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //content -->
        </main>
        <!-- //main -->
    </div>

    <!-- Scripts -->
    <script src="../assets/js/overlayscrollbars.browser.es6.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <!-- //Scripts -->

    <!-- grid -->
    <script>
        let tabledata = [
            { no: "1", category: "이벤트", thumbnail: "https://www.woongjin.com/File_win/images/notice/20260703/8bf777d6a4c24c18b2ac9dc2a13f9bfe.jpg", title: "[AWS PoC 이벤트] Claude Code on Amazon Bedrock ", display: true, date: "2026-05-14", },
            { no: "2", category: "공지사항", thumbnail: "https://www.woongjin.com/File_win/images/notice/20260703/8bf777d6a4c24c18b2ac9dc2a13f9bfe.jpg", title: "[AWS PoC 이벤트] Claude Code on Amazon Bedrock ", display: false, date: "2026-06-14", },
            { no: "3", category: "이벤트", thumbnail: "https://www.woongjin.com/File_win/images/notice/20260703/8bf777d6a4c24c18b2ac9dc2a13f9bfe.jpg", title: "[AWS PoC 이벤트] Claude Code on Amazon Bedrock ", display: true, date: "2026-07-14", },
            { no: "4", category: "공지사항", thumbnail: "https://www.woongjin.com/File_win/images/notice/20260703/8bf777d6a4c24c18b2ac9dc2a13f9bfe.jpg", title: "[AWS PoC 이벤트] Claude Code on Amazon Bedrock ", display: false, date: "2026-08-14", },
            { no: "5", category: "이벤트", thumbnail: "https://www.woongjin.com/File_win/images/notice/20260703/8bf777d6a4c24c18b2ac9dc2a13f9bfe.jpg", title: "[AWS PoC 이벤트] Claude Code on Amazon Bedrock ", display: true, date: "2026-09-14", },
        ];

        let table = new Tabulator("#example-table", {
            data: tabledata,
            layout: "fitColumns",       // columns expand to fill the available width
            pagination: true,
            paginationSize: 10,
            paginationCounterElement:".page-count",
            paginationCounter: function (pageSize, currentRow, currentPage, totalRows, totalPages) {
                return `<span>현재 페이지 : ${currentPage} / ${totalPages}</span><span>전체글 : ${totalRows}개</span>`;
            },
            rowHeader: {
                headerSort: false, resizable: false, frozen: true, width: 50, headerHozAlign: "center", hozAlign: "center", cssClass: "align-center", formatter: "rowSelection", titleFormatter: "rowSelection", cellClick: function (e, cell) {
                    cell.getRow().toggleSelect();
                }
            },
            columns: [
                { title: "번호", field: "no", width: 80, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "카테고리", field: "category", width: 100, headerHozAlign: "center", headerSort: false, hozAlign: "center", },
                { title: "썸네일", field: "thumbnail", width: 180, headerHozAlign: "center", headerSort: false, formatter: function (cell, formatterParams) { let imgUrl = cell.getValue(); return "<img src='" + imgUrl + "' alt='배너이미지' style='height:80px;aspect-ratio:16/9;'>";} },
                { title: "제목", field: "title", headerHozAlign: "center", headerSort: false, cssClass: "justify-content-start", formatter: "link", formatterParams: {url:"./liblibraryDtl.html"} },
                { title: "활성여부", field: "display", width: 120, headerHozAlign: "center", headerSort: true, hozAlign: "center", formatter: function(cell) { return cell.getValue() === true ? "활성" : "비활성"; } },
                { title: "작성일", field: "date", width: 140, headerHozAlign: "center", headerSort: true, hozAlign: "center", },
            ],
        });
    </script>
</body>

</html>
