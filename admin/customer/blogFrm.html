<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT 관리자</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/overlayscrollbars.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.min.css">
    <!-- <link rel="stylesheet" href="../assets/css/tabulator.min.css"> -->
    <link rel="stylesheet" href="../assets/css/tabulator_bootstrap5.css">
    <link rel="stylesheet" href="../assets/css/adminlte.css">
    <link rel="stylesheet" href="../assets/css/flatpickr.min.css">
    <link rel="stylesheet" href="../assets/css/customize.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item user-menu d-flex align-items-center me-3">
                        홍길동
                    </li>
                    <li>
                        <a href="#none" class="btn btn-secondary btn-sm float-end">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="btn-logout fw-bolder">로그아웃</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- //header -->

        <!-- menu -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <!-- logo -->
            <div class="sidebar-brand">
                <a href="#none" class="brand-link">
                    <img src="../assets/img/logo.png" alt="woongjin" class="brand-image">
                </a>
            </div>
            <!-- //logo -->

            <!-- menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2" aria-label="Main navigation">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false"
                        id="navigation">
                        <li class="nav-item">
                            <a href="../page_list.html" class="nav-link active">
                                <p>page_list</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <!-- //menu -->
        </aside>
        <!-- //menu -->

        <!-- main -->
        <main class="app-main">
            <!-- title -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-12">
                            <h3 class="mb-0">블로그</h3>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //title -->

            <!-- content -->
            <div class="app-content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <form action="">
                                <div class="row mb-3">
                                    <label for="category" class="col-sm-2 col-form-label text-center fw-bold">카테고리</label>
                                    <div class="col-sm-10">
                                        <select class="form-select form-select-sm me-2 d-inline" name="category" id="category" style="width: 20%;">
                                            <option selected>선택</option>
                                            <option>INSIGHT</option>
                                            <option>NOW</option>
                                            <option>PEOPLE</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="title" class="col-sm-2 col-form-label text-center fw-bold">제목</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" name="title" id="title">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="thumbnail" class="col-sm-2 col-form-label text-center fw-bold">썸네일</label>
                                    <div class="col-sm-10">
                                        <input class="form-control d-inline-block" type="file" id="thumbnail">
                                        <span class="d-block mt-1 text-primary">* 이미지 사이즈 340 X 340</span>
                                    </div>
                                </div>                                

                                <div class="row mb-3">
                                    <label for="registerDate" class="col-sm-2 col-form-label text-center fw-bold">등록일자</label>
                                    <div class="col-sm-10 d-flex align-itmes-center">
                                        <div class="flatpickr-wrapper form-control d-inline p-0" style="width: 200px;">
                                            <input type="text" data-input id="registerDate" />
                                            <button type="button" class="calendar-btn" data-toggle>
                                                <i class="bi bi-calendar"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <span class="col-sm-2 col-form-label text-center fw-bold">활성 여부</span>
                                    <div class="col-sm-10 d-flex align-items-center">
                                        <div class="form-check me-5">
                                            <input class="form-check-input" type="radio" name="display" id="display_y" checked>
                                            <label class="form-check-label" for="display_y">활성</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="display" id="display_n">
                                            <label class="form-check-label" for="display_n">비활성</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="summary" class="col-sm-2 col-form-label text-center fw-bold">내용 요약</label>
                                    <div class="col-sm-10">
                                        <textarea class="form-control" name="summary" id="summary" rows="5"></textarea>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="content" class="col-sm-2 col-form-label text-center fw-bold">내용</label>
                                    <div class="col-sm-10">
                                        <div style="display: flex; align-items: center; justify-content: center; height: 1000px;background: #eee;">editor view</div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="uploadFile" class="col-sm-2 col-form-label text-center fw-bold">파일첨부</label>
                                    <div class="col-sm-10">
                                        <input class="form-control d-inline-block" type="file" id="uploadFile">
                                        <span class="d-block mt-1 text-primary">* 최대 파일크기 파일당 50MB</span>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer text-end">
                            <button type="button" class="btn btn-danger">취소</button>
                            <button type="button" class="btn btn-primary">저장</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //content -->
        </main>
        <!-- //main -->
    </div>

    <!-- Scripts -->
    <script src="../assets/js/overlayscrollbars.browser.es6.min.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/tabulator.min.js"></script>
    <script src="../assets/js/adminlte.js"></script>
    <script src="../assets/js/flatpickr.min.js"></script>
    <script src="../assets/js/flatpickr_ko.js"></script>
    <!-- //Scripts -->

    <script>
        flatpickr(".flatpickr-wrapper", {
            wrap: true,
            locale: "ko",
        });
    </script>

</body>

</html>
