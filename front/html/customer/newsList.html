<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/ui.css">
</head>

<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title mediaroom">
            <div class="inner-cont">
                <p class="tit-info1">웅진의 뉴스 · 이벤트 · 공지사항 · 블로그</p>
                <h1>미디어룸</h1>
                <p class="tit-info2">
                    웅진IT의 새로운 소식과 다양한 이야기를 만나보세요. 최신 뉴스, 이벤트, 공지사항부터 업계 트렌드를 담은 블로그까지 한눈에 확인하실 수 있습니다.
                </p>
            </div>

            <div class="wjh-mediaroom">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:305px -25px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.6s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:110s;--lw:1px;left:55px;top:-275px;width:500px;height:500px;--lw-scale:0.8;--c-dark:#cccccc;--c-light:#cccccc;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="CoilForm" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:494px 521px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.5s cubic-bezier(.16,1,.3,1) .5s forwards;--spin:220s;--dir:reverse;--lw:1px;left:364px;top:391px;width:260px;height:260px;--lw-scale:0.8;--c-dark:#c2c2c2;--c-light:#c2c2c2;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="CoilForm" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1622px 270px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn3 2.2s cubic-bezier(.16,1,.3,1) .9s both;--spin:65s;--lw:1px;left:1442px;top:90px;width:360px;height:360px;--lw-scale:0.8;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="CoilForm" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- page content -->
        <div class="content">
            <div class="category-list">
                <button type="button" class="act">뉴스</button>
                <button type="button">이벤트</button>
                <button type="button">공지사항</button>
                <button type="button">블로그</button>
            </div>
            <!-- inner cont -->
            <div class="inner-cont">
                <!-- board search -->
                <div class="board-search">
                    <form action="">
                        <input type="text" placeholder="검색어를 입력해주세요">
                        <button type="button"><span class="blind">검색</span></button>
                    </form>
                </div>

                <!-- board list -->
                <div class="board-list type2 type3">
                    <span class="board-item">
                        <span class="cont">
                            <span class="cont-txt1">IT 게임체인저의 역할과 S/4HANA Digital Core 전략의 중요성</span>
                            <span class="cont-txt2">
                                <span>2026.06.28</span>
                                <span>서울경제</span>
                            </span>
                        </span>
                        <span class="btn">
                            <a href="#none" class="btn-link"><span class="blind">바로가기</span></a>
                        </span>
                    </span>

                    <span class="board-item">
                        <span class="cont">
                            <span class="cont-txt1">웅진 Microsoft 사업 소개서</span>
                            <span class="cont-txt2">
                                <span>2026.06.28</span>
                                <span>서울경제</span>
                            </span>
                        </span>
                        <span class="btn">
                            <a href="#none" class="btn-link"><span class="blind">바로가기</span></a>
                        </span>
                    </span>
                </div>
                <!-- //board list -->

                <!-- board more -->
                <div class="btn-area board-more">
                    <button type="button" class="btn-large btn-primary"><span>더보기 <i>(1/50)</i></span></button>
                </div>

                <!-- pagination -->
                <div class="pagination">
                    <a href="#none" class="first"><span class="blind">처음</span></a>
                    <a href="#none" class="prev"><span class="blind">이전</span></a>
                    <a href="#none" class="act">1</a>
                    <a href="#none">2</a>
                    <a href="#none">3</a>
                    <a href="#none">4</a>
                    <a href="#none">5</a>
                    <a href="#none">6</a>
                    <a href="#none">7</a>
                    <a href="#none">8</a>
                    <a href="#none">9</a>
                    <a href="#none">10</a>
                    <a href="#none" class="next"><span class="blind">다음</span></a>
                    <a href="#none" class="last"><span class="blind">마지막</span></a>
                </div>
                <!-- //pagination -->
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <script src="../../js/ui.js"></script>
</body>

</html>
