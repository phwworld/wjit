<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>

<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title aicc">
            <div class="inner-cont">
                <p class="tit-info1">웅진의 뉴스 · 이벤트 ·  공지사항 ·  블로그</p>

            </div>
        </div>
        
        <!-- page content -->
        <div class="content">
            <!-- inner cont -->
            <div class="inner-cont">
                <div class="category-list">
                    <button type="button">뉴스</button>

                    <div class="category-list2">
                        <button type="button" class="act">ALL</button>
                        <button type="button">INSIGHT</button>
                        <button type="button">NOW</button>
                        <button type="button">PEOPLE</button>
                    </div>
                </div>

                <!-- board view -->
                <div class="board-view blog-view">
                    <div class="view-title">
                        <p class="title-txt1">SAP Business One</p>
                        <p class="title-txt2">건설기계 유통 T사 SAP Business One 기반 전사 통합 ERP 구축건설기계 유통 T사 SAP Business One 기반 전사 통합 ERP 구축</p>
                        <p class="title-txt3">2026.05.22.</p>
                    </div>

                    <div class="view-cont">
                        에디터뷰 영역
                    </div>
                </div>
                <!-- //board view -->

                <!-- btn area -->
                <div class="btn-area">
                    <a href="#none" class="btn-large btn-primary">목록보기</a>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
