<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/ui.css">
</head>
<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title resources">
            <div class="inner-cont">
                <p class="tit-info1">다양한 산업 분야의 고객사와 함께 수행한 프로젝트</p>
                <h3>프로젝트 사례</h3>
                <p class="tit-info2">
                    웅진IT가 다양한 산업 분야의 고객사와 함께  기획부터 설계, 구축, 운영까지 검증된 노하우와 기술력으로 완성한 프로젝트를 소개합니다.
                </p>
            </div>

            <div class="wjh-resources">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:90px 0px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.6s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:110s;--lw:1px;--bt0:0s;--bstag:0s;--bdur:.01s;left:-160px;top:-250px;width:500px;height:500px;--lw-scale:0.8;--c-dark:#dbdbdb;--c-light:#dbdbdb;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="TriVortex" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:384px 496px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.5s cubic-bezier(.16,1,.3,1) .5s forwards;--spin:220s;--dir:reverse;--lw:1px;--bt0:0s;--bstag:0s;--bdur:.01s;left:254px;top:366px;width:260px;height:260px;--lw-scale:1;--c-dark:#cfcfcf;--c-light:#cfcfcf;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="TriVortex" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1382px 205px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);--spin:65s;--lw:1px;--bt0:.9s;--bstag:.11s;--bdur:8s;--b-name:triLoop;--b-iter:infinite;left:1202px;top:25px;width:360px;height:360px;--lw-scale:1;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="TriVortex" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- page content -->
        <div class="content">
            <div class="category-list">
                <button type="button" class="act">ALL</button>
                <button type="button">WRMS</button>
                <button type="button">WDMS</button>
                <button type="button">CLOUD</button>
                <button type="button">ERP</button>
                <button type="button">로우코드</button>
                <button type="button">렌탈</button>
                <button type="button">모빌리티</button>
                <button type="button">제조</button>
                <button type="button">바이오</button>
                <button type="button">소비재</button>
                <button type="button">물류</button>
                <button type="button">반도체</button>
            </div>
            <!-- inner cont -->
            <div class="inner-cont">
                <!-- board view -->
                <div class="board-view">
                    <div class="view-title">
                        <p class="title-txt1">SAP Business One</p>
                        <p class="title-txt2">건설기계 유통 T사 SAP Business One 기반 전사 통합 ERP 구축건설기계 유통 T사 SAP Business One 기반 전사 통합 ERP 구축</p>
                        <p class="title-txt3">2026.05.22.</p>
                    </div>

                    <div class="view-cont">
                        에디터뷰 영역
                    </div>
                </div>
                <!-- //board view -->

                <!-- btn area -->
                <div class="btn-area">
                    <a href="#none" class="btn-large btn-primary">목록보기</a>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <script src="../../js/ui.js"></script>
</body>
</html>
