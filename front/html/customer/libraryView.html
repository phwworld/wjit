<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/ui.css">
</head>
<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title mediaroom">
            <div class="inner-cont">
                <p class="tit-info1">웅진의 뉴스 · 이벤트 ·  공지사항 ·  블로그</p>
                <h3>미디어룸</h3>
                <p class="tit-info2">
                    웅진IT의 새로운 소식과 다양한 이야기를 만나보세요. 최신 뉴스, 이벤트, 공지사항부터 업계 트렌드를 담은 블로그까지 한눈에 확인하실 수 있습니다.
                </p>
            </div>

            <div class="wjh-mediaroom">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:65px -25px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.6s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:110s;--lw:1px;left:-185px;top:-275px;width:500px;height:500px;--lw-scale:0.8;--c-dark:#dbdbdb;--c-light:#dbdbdb;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="CoilForm" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:254px 521px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.5s cubic-bezier(.16,1,.3,1) .5s forwards;--spin:220s;--dir:reverse;--lw:1px;left:124px;top:391px;width:260px;height:260px;--lw-scale:0.8;--c-dark:#cfcfcf;--c-light:#cfcfcf;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="CoilForm" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1382px 270px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn3 2.2s cubic-bezier(.16,1,.3,1) .9s both;--spin:65s;--lw:1px;left:1202px;top:90px;width:360px;height:360px;--lw-scale:0.8;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="CoilForm" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- page content -->
        <div class="content">
            <div class="category-list">
                <button type="button">뉴스</button>
                <button type="button" class="act">이벤트</button>
                <button type="button">공지사항</button>
                <button type="button">블로그</button>
            </div>
            <!-- inner cont -->
            <div class="inner-cont">
                <!-- board view -->
                <div class="board-view">
                    <div class="view-title">
                        <p class="title-txt1">SAP Business One</p>
                        <p class="title-txt2">건설기계 유통 T사 SAP Business One 기반 전사 통합 ERP 구축건설기계 유통 T사 SAP Business One 기반 전사 통합 ERP 구축</p>
                        <p class="title-txt3">2026.05.22.</p>
                    </div>

                    <div class="view-cont">
                        에디터뷰 영역
                    </div>
                </div>
                <!-- //board view -->

                <!-- btn area -->
                <div class="btn-area">
                    <a href="#none" class="btn-large btn-primary">목록보기</a>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <script src="../../js/ui.js"></script>
</body>
</html>
