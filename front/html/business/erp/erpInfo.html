<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../../css/ui.css">
</head>

<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title erp">
            <div class="inner-cont">
                <p class="tit-info1">기업 성장을 이끄는 차세대 ERP</p>
                <h3>SAP ERP</h3>
            </div>

            <div class="wjh-erp">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:330px -55px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="--n-orig:0;--n-ring:1;position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.6s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:110s;--lw:1px;left:5px;top:-380px;width:650px;height:650px;--lw-scale:0.3;--c-dark:#dbdbdb;--c-light:#dbdbdb;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="SunSpiral" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:494px 516px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="--n-orig:0;--n-ring:1;position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.5s cubic-bezier(.16,1,.3,1) .5s forwards;--spin:220s;--dir:reverse;--lw:1px;left:338px;top:360px;width:312px;height:312px;--lw-scale:0.6;--c-dark:#cfcfcf;--c-light:#cfcfcf;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="SunSpiral" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1622px 270px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);--n-in:none;--n-orig:0;--n-fill:nRing;--ring-base:0s;--ring-st:.03s;--n-dur:10s;--n-iter:infinite;--n-pulse:nPulse;--t0:.9s;--drift:11s;--tx:0deg;--ty:0deg;--spin:90s;--lw:1px;left:1432px;top:80px;width:380px;height:380px;--lw-scale:0.4;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="SunSpiral" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- page content -->
        <div class="content">
            <!-- inner cont -->
            <div class="inner-cont">
                <!-- service list -->
                <div class="service-list">
                    <a class="service-item" href="#none">
                        <span>모든 산업군을 위한 지능형 ERP</span>
                        SAP S/4HANA
                    </a>
                    <a class="service-item" href="#none">
                        <span>중견중소기업을 위한 ERP</span>
                        SAP Business One
                    </a>
                    <a class="service-item" href="#none">
                        <span>스마트 물류 혁신을 위한</span>
                        AI웅수
                    </a>
                    <a class="service-item" href="#none">
                        <span>민첩성과 확장성을 갖춘 차세대 ERP</span>
                        Microsoft <br class="pc">Dynamics 365
                    </a>
                    <a class="service-item" href="#none">
                        <span>SAP Business One 기반 제조혁신</span>
                        Smart Factory
                    </a>
                    <a class="service-item" href="#none">
                        <span>SAP 컨버전·운영 경험을 집약한 패키지</span>
                        WiJARD Package
                    </a>
                    <a class="service-item" href="#none">
                        <span>올인원 클라우드 ERP</span>
                        CLOUD ONEPACK
                    </a>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <div class="mobile-float-menu">
        <a href="#none">문의하기</a>
        <a href="#none">프로젝트사례</a>
    </div>

    <script src="../../../js/ui.js"></script>
    <script src="../../../js/title.js"></script>
</body>

</html>
