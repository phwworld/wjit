<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../../css/ui.css">
</head>

<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title ai">
            <div class="inner-cont">
                <p class="tit-info1">데이터에서 인사이트까지</p>
                <h3>AI 서비스&플랫폼</h3>
            </div>

            <div class="wjh-company">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:45px 0px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.2s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:82s;--lw:1px;--t0:0s;transform-style:preserve-3d;left:-205px;top:-250px;width:500px;height:500px;--lw-scale:1;--c-dark:#dbdbdb;--c-light:#dbdbdb;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="HelixArc" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:254px 496px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.13s cubic-bezier(.16,1,.3,1) .38s forwards;--spin:165s;--dir:reverse;--lw:1px;--t0:0s;transform-style:preserve-3d;left:124px;top:366px;width:260px;height:260px;--lw-scale:0.8;--c-dark:#cfcfcf;--c-light:#cfcfcf;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="HelixArc" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1382px 270px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn3 1.65s cubic-bezier(.16,1,.3,1) .68s both;--spin:49s;--lw:1px;--t0:0s;transform-style:preserve-3d;left:1182px;top:70px;width:400px;height:400px;--lw-scale:1;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="HelixArc" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- page content -->
        <div class="content">
            <!-- inner cont -->
            <div class="inner-cont">
                <!-- service list -->
                <div class="service-list">
                    <a class="service-item" href="#none">
                        <span>고객 응대를 넘어, 운영을 자동화하다</span>
                        AICC
                    </a>
                    <a class="service-item" href="#none">
                        <span>데이터에서 인사이트까지, <br class="pc">하나의 AI 여정</span>
                        WIKL
                    </a>
                    <a class="service-item" href="#none">
                        <span>그룹웨어에 특화된 생성형 AI 비서</span>
                        AI웅수
                    </a>
                    <a class="service-item" href="#none">
                        <span>ERP 데이터 기반 의사결정 AI</span>
                        SAP Joule
                    </a>
                    <a class="service-item" href="#none">
                        <span>개발과 업무를 가속하는 로우코드 AI</span>
                        Mendix MAIA
                    </a>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <div class="mobile-float-menu">
        <a href="#none">문의하기</a>
        <a href="#none">프로젝트사례</a>
    </div>

    <script src="../../../js/ui.js"></script>
</body>

</html>
