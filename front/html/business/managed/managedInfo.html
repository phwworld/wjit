<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../../css/ui.css">
</head>

<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title managed info-tit">
            <div class="inner-cont">
                <p class="tit-info1">안정적인 운영과 지속적인 IT 고도화 </p>
                <h3>Managed<br class="mo"> Services</h3>
                <p class="tit-info2">안정성과 실행력을 갖춘 통합 서비스를 만나보세요.</p>
            </div>

            <div class="wjh-managed-service">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:315px 30px;transform:rotate(59deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.6s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:110s;--lw:1px;left:27.5px;top:-257.5px;width:575px;height:575px;--lw-scale:0.5;--c-dark:#dbdbdb;--c-light:#dbdbdb;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="StepStack" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:604px 496px;transform:rotate(-14deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.5s cubic-bezier(.16,1,.3,1) .5s forwards;--spin:220s;--dir:reverse;--lw:1px;left:409px;top:301px;width:390px;height:390px;--lw-scale:0.5;--c-dark:#cfcfcf;--c-light:#cfcfcf;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="StepStack" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1622px 270px;transform:rotate(74deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);--ss-g:ssLoop;--ss-f:ssFade;--ss-dur:10s;--t0:.9s;--drift:11s;--spin:65s;--lw:1px;left:1382px;top:30px;width:480px;height:480px;--lw-scale:0.3;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="StepStack" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- page content -->
        <div class="content">
            <!-- inner cont -->
            <div class="inner-cont">
                <!-- service list -->
                <div class="service-list">
                    <a class="service-item" href="#none">
                        <span>고안정적인 운영을 기반으로 <br>기업 경쟁력을 강화하는</span>
                        IT Outsourcing
                    </a>
                    <a class="service-item" href="#none">
                        <span>구축 및 고도화를 <br>수행하는 개발 실행 거점</span>
                        GDC
                    </a>
                    <a class="service-item" href="#none">
                        <span>고객 접점을 관리하는 <br>전문 운영 서비스</span>
                        컨택센터 BPO
                    </a>
                    <a class="service-item" href="#none">
                        <span>정확성과 안정성을 갖춘 <br>급여 관리 서비스</span>
                        Payroll BPO
                    </a>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <div class="mobile-float-menu">
        <a href="#none">문의하기</a>
        <a href="#none">프로젝트사례</a>
    </div>

    <script src="../../../js/ui.js"></script>
</body>

</html>
