<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/ui.css">
</head>
<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title company">
            <div class="inner-cont">
                <p class="tit-info1">디지털 혁신의 중심에 웅진</p>
                <h1>회사정보</h1>
                <p class="tit-info2">
                    SAP ERP, 클라우드, 렌탈특화솔루션, Web / SI분야등 사업을 확대해가며 디지털 혁신을 이루고, 기업 고객의 성공적인 미래가치창출을 이루기 위해 함께하는 IT컨설팅 파트너 입니다. 
                </p>
            </div>

            <div class="wjh-company">
                <!-- 좌 상단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:290px 0px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--t">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn1 1.6s cubic-bezier(.16,1,.3,1) 0s forwards;--spin:110s;--lw:1px;left:40px;top:-250px;width:500px;height:500px;--lw-scale:0.1;--c-dark:#d0d0d0;--c-light:#d0d0d0;"
                        class="wjh-motif wjh-motif--t">
                        <div data-wjh-motif="RadialDisc" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 좌 하단 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:494px 496px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--b">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn2 1.5s cubic-bezier(.16,1,.3,1) .5s forwards;--spin:220s;--dir:reverse;--lw:1px;left:364px;top:366px;width:260px;height:260px;--lw-scale:0.8;--c-dark:#cfcfcf;--c-light:#cfcfcf;"
                        class="wjh-motif wjh-motif--b">
                        <div data-wjh-motif="RadialDisc" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
                <!-- 우측 메인 -->
                <div style="position:absolute;inset:0;transform-style:preserve-3d;transform-origin:1610px 270px;transform:rotate(0deg);"
                    class="wjh-pos wjh-pos--m">
                    <div style="position:absolute;color:var(--c-dark, #888888);opacity:0;animation:aIn3 2.2s cubic-bezier(.16,1,.3,1) .9s both;--spin:65s;--lw:1px;left:1430px;top:90px;width:360px;height:360px;--lw-scale:0.8;--c-dark:#aaaaaa;--c-light:#aaaaaa;"
                        class="wjh-motif wjh-motif--m">
                        <div data-wjh-motif="RadialDisc" style="position:absolute;left:0;top:0;width:100%;height:100%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- page content -->
        <div class="content">
            <div class="category-list col3">
                <button type="button">기업소개</button>
                <button type="button" class="act">투자정보</button>
                <button type="button">해외정보</button>
            </div>
            <!-- inner cont -->
            <div class="inner-cont">
                <div class="company-tab col5">
                    <div class="tab-scroll">
                        <button type="button">재무정보</button>
                        <button type="button">주식정보</button>
                        <button type="button">공시정보</button>
                        <button type="button">전자공고</button>
                        <button type="button" class="act">기업회생<span class="mo-hide"> 게시판</span></button>
                    </div>
                </div>

                <div class="company-cont">
                    <!-- board view -->
                    <div class="board-view">
                        <div class="view-title">
                            <p class="title-txt2">제43기 결산공고(연결)제43기 결산공고(연결)제43기 결산공고(연결)</p>
                            <p class="title-txt3">2026.05.22.</p>
                        </div>

                        <div class="view-cont">
                            에디터뷰 영역
                        </div>
                    </div>
                    <!-- //board view -->

                    <!-- btn area -->
                    <div class="btn-area">
                        <a href="#none" class="btn-large btn-primary">목록보기</a>
                    </div>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <div class="mobile-float-menu">
        <a href="#none">문의하기</a>
        <a href="#none">프로젝트사례</a>
    </div>

    <script src="../../js/ui.js"></script>
</body>
</html>
