<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅진IT</title>
    <link rel="shortcut icon" href="../../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/ui.css">
</head>
<body>
    <!-- header -->
    <header>
        <div class="inner-cont">
            header
        </div>
    </header>
    <!-- //header -->

    <main>
        <!-- page title -->
        <div class="title aicc">
            <div class="inner-cont">
                <p class="tit-info1">디지털 혁신의 중심에 웅진</p>
                <h3>회사정보</h3>
                <p class="tit-info2">
                    SAP ERP, 클라우드, 렌탈특화솔루션, Web / SI분야등 사업을 확대해가며 디지털 혁신을 이루고, 기업 고객의 성공적인 미래가치창출을 이루기 위해 함께하는 IT컨설팅 파트너 입니다. 
                </p>
            </div>
        </div>
        
        <!-- page content -->
        <div class="content">
            <div class="category-list col3">
                <button type="button">기업소개</button>
                <button type="button" class="act">투자정보</button>
                <button type="button">해외정보</button>
            </div>
            <!-- inner cont -->
            <div class="inner-cont">
                <div class="company-tab col5">
                    <button type="button">재무정보</button>
                    <button type="button">주식정보</button>
                    <button type="button">공시정보</button>
                    <button type="button" class="act">전자공고</button>
                    <button type="button">기업회생 게시판</button>
                </div>

                <div class="company-cont">
                    <h4 class="c-tit">전자공고</h4>

                    <!-- board view -->
                    <div class="board-view">
                        <div class="view-title">
                            <p class="title-txt2">제43기 결산공고(연결)제43기 결산공고(연결)제43기 결산공고(연결)</p>
                            <p class="title-txt3">2026.05.22.</p>
                        </div>

                        <div class="view-cont">
                            에디터뷰 영역
                        </div>
                    </div>
                    <!-- //board view -->

                    <!-- btn area -->
                    <div class="btn-area">
                        <a href="#none" class="btn-large btn-primary">목록보기</a>
                    </div>
                </div>
            </div>
            <!-- //inner cont -->
        </div>
        <!-- //page content -->
    </main>

    <!-- footer -->
    <footer>
        <div class="inner-cont">
            footer
        </div>
    </footer>
    <!-- //footer -->

    <div class="mobile-float-menu">
        <a href="#none">문의하기</a>
        <a href="#none">프로젝트사례</a>
    </div>

    <script src="../../js/ui.js"></script>

</html>
